name: Czech official DMR5G terrain live QA - no public raster distribution
on:
  push:
    branches: [main]
    paths:
      - 'geodata/cuzk_dmr5g_fetch.py'
      - 'geodata/test_cuzk_dmr5g_fetch.py'
      - '.github/workflows/cuzk-dmr5g-live-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-terrain-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geo and raster libraries
        run: |
          python -m pip install -r geodata/requirements.txt
          python -m pip install rasterio==1.4.3 numpy==2.2.6
      - name: Unit-test strict official CRS and format validation
        run: python -m unittest geodata.test_cuzk_dmr5g_fetch -v
      - name: Download real DMR5G excerpt privately on runner
        run: python -m geodata.cuzk_dmr5g_fetch --output /tmp/cuzk_dmr5g_internal.tif
      - name: Generate test-only 256-metre world terrain tiles
        run: |
          python -m geodata.terrain_geotiff \
            --input /tmp/cuzk_dmr5g_internal.tif \
            --output-dir /tmp/cuzk_dmr5g_unpublished_world_tiles \
            --city-id CESKY_TESIN_CENTER \
            --source-id CUZK_DMR5G_IMAGESERVER \
            --source-url 'https://ags.cuzk.gov.cz/arcgis2/rest/services/dmr5g/ImageServer' \
            --license-id CUZK_RIGHTS_REVIEW_REQUIRED \
            --vertical-datum CZ-BPV --source-epoch 2013 \
            --west -3 --east -2 --south -2 --north -1 \
            --spacing-m 32 --zero-is-unverified-nodata --internal-preview
      - name: Verify real geographic raster was processed without distribution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/cuzk_dmr5g_unpublished_world_tiles/manifest.json').read_text())
          assert m['source_crs']=='EPSG:5514'
          assert m['vertical_datum']=='CZ-BPV'
          assert m['valid_sample_count'] > 10
          assert m['tile_count']==4
          assert m['rights_review_status']=='REVIEW_PENDING_INTERNAL_ONLY'
          assert m['zero_value_policy']=='MASKED_AS_UNVERIFIED_VOID_FOR_THIS_AREA'
          assert m['vertical_registration_to_game']=='NOT_VERIFIED'
          from math import isfinite
          p=Path('/tmp/cuzk_dmr5g_unpublished_world_tiles')
          cells=[]
          for tile in p.glob('E*.json'):
            cells.extend(h for h in json.loads(tile.read_text())['heights_m'] if h is not None)
          assert len(cells)==m['valid_sample_count']
          assert all(isfinite(h) and 100<h<1000 for h in cells), 'Terrain values outside safe Czech Cieszyn QA bounds'
          assert max(cells)-min(cells)>0.5, 'Flat constant raster is not a valid terrain model'
          a=json.loads((p/'E-000003_N-000001.json').read_text())
          b=json.loads((p/'E-000002_N-000001.json').read_text())
          n=a['grid_width']
          assert n==b['grid_width']
          for y in range(n):
            assert a['heights_m'][y*n+(n-1)]==b['heights_m'][y*n], 'Seam height discontinuity'
          print('REAL CUZK SOURCE TECHNICALLY VERIFIED, QA HEIGHT RANGE',round(min(cells),2),round(max(cells),2),'NO PUBLIC RASTER ARTIFACT')
          PY
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: false
      - name: Import Godot project on internal CI worker
        run: godot --headless --path godot --editor --import --quit
      - name: Load REAL DMR5G data into private Godot terrain mesh and test datums
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --script res://tests/test_real_cuzk_terrain.gd -- \
            --terrain-source=/tmp/cuzk_dmr5g_unpublished_world_tiles \
            2>&1 | tee /tmp/real-cuzk-runtime-metadata.log
          if grep -q -e 'SCRIPT ERROR:' -e 'REAL_CUZK_GODOT_QA FAILURES: [1-9]' /tmp/real-cuzk-runtime-metadata.log; then
            exit 1
          fi
      # Deliberately no upload-artifact, git add, cache or publication of raw raster/tiles.
