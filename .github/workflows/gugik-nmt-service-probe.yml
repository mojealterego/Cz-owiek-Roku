name: Polish GUGiK NMT WCS capabilities QA
on:
  push:
    branches: [main]
    paths:
      - 'geodata/gugik_wcs_probe.py'
      - 'geodata/test_gugik_wcs_probe.py'
      - '.github/workflows/gugik-nmt-service-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install safe XML parser
        run: python -m pip install defusedxml==0.7.1
      - name: Unit-test safe WCS metadata parser
        run: python -m unittest geodata.test_gugik_wcs_probe -v
      - name: Discover real GUGiK GeoTIFF WCS capabilities
        run: python -m geodata.gugik_wcs_probe --version 2.0.1
      # Do not publish a guess of vertical datum or any raster until validated.
