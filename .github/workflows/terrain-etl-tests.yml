name: WORLD 1to1 terrain GeoTIFF QA
on:
  push:
    branches: [main]
    paths:
      - 'geodata/terrain_geotiff.py'
      - 'geodata/test_terrain_geotiff.py'
      - '.github/workflows/terrain-etl-tests.yml'
  pull_request:
    paths:
      - 'geodata/terrain_geotiff.py'
      - 'geodata/test_terrain_geotiff.py'
      - '.github/workflows/terrain-etl-tests.yml'
permissions:
  contents: read
jobs:
  terrain-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          python -m pip install -r geodata/requirements.txt
          python -m pip install rasterio==1.4.3 numpy==2.2.6
      - name: Run synthetic-only terrain source validation
        run: python -m unittest geodata.test_terrain_geotiff -v
      - name: Reject any accidentally committed synthetic terrain files
        run: |
          test ! -e godot/data/world/terrain_source
          echo 'No invented terrain geometry committed.'
