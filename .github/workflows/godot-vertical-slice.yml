name: Godot Android slice validation
on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-vertical-slice.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-vertical-slice.yml'
permissions:
  contents: read
jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: false
      - name: Verify editor
        run: godot --version
      - name: Import resources and parse game
        run: godot --headless --path godot --editor --import --quit
      - name: Run state contract checks
        run: godot --headless --path godot --script res://tests/test_state.gd
      - name: Boot main scene and reject runtime script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --quit-after 40 2>&1 | tee /tmp/moty-main.log
          if grep -q 'SCRIPT ERROR:' /tmp/moty-main.log; then exit 1; fi
      - name: Validate transborder world preview scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --quit-after 40 --scene res://scenes/world_preview.tscn 2>&1 | tee /tmp/moty-world.log
          if grep -q 'SCRIPT ERROR:' /tmp/moty-world.log; then exit 1; fi
      - name: Run CH01 PL/EN end-to-end save/choice/continue test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --script res://tests/test_e2e_ch01.gd 2>&1 | tee /tmp/moty-ch01-e2e.log
          if grep -q -e 'SCRIPT ERROR:' -e 'CH01 INTERACTIVE E2E FAILURES: [1-9]' /tmp/moty-ch01-e2e.log; then exit 1; fi
      - name: Validate performance instrumentation calculations and local report
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --script res://tests/test_world_performance.gd 2>&1 | tee /tmp/moty-perf-model.log
          if grep -q -e 'SCRIPT ERROR:' -e 'WORLD PERFORMANCE MODEL FAILURES: [1-9]' /tmp/moty-perf-model.log; then exit 1; fi
      - name: Validate actual OSM geometry import and metric outlines
        run: godot --headless --path godot --script res://tests/test_osm_preview.gd
      - name: Validate source-height terrain 3D meshing (synthetic QA only)
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --script res://tests/test_terrain_qa_layer.gd 2>&1 | tee /tmp/moty-terrain.log
          if grep -q 'SCRIPT ERROR:' /tmp/moty-terrain.log; then exit 1; fi
      - name: Verify real PL/CZ OSM mobile sector streaming and eviction
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --script res://tests/test_osm_streamer.gd 2>&1 | tee /tmp/moty-streamer.log
          if grep -q -e 'SCRIPT ERROR:' -e 'OSM STREAMING QA FAILURES: [1-9]' /tmp/moty-streamer.log; then exit 1; fi
