name: Godot Android slice validation
on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-vertical-slice.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-vertical-slice.yml'
permissions:
  contents: read
jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: false
      - name: Verify editor
        run: godot --version
      - name: Import resources and parse game
        run: godot --headless --path godot --editor --import --quit
      - name: Run state contract checks
        run: godot --headless --path godot --script res://tests/test_state.gd
      - name: Boot main scene and reject runtime script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --quit-after 40 2>&1 | tee /tmp/moty-main.log
          if grep -q 'SCRIPT ERROR:' /tmp/moty-main.log; then exit 1; fi
      - name: Validate transborder world preview scene
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path godot --quit-after 40 --scene res://scenes/world_preview.tscn 2>&1 | tee /tmp/moty-world.log
          if grep -q 'SCRIPT ERROR:' /tmp/moty-world.log; then exit 1; fi
      - name: Validate actual OSM geometry import and metric outlines
        run: godot --headless --path godot --script res://tests/test_osm_preview.gd
